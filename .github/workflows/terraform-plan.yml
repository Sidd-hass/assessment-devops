name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    env:
      # Dummy credentials: the plan is run with -refresh=false against a local backend, so AWS is never called.
      # For real plans, replace with OIDC (aws-actions/configure-aws-credentials) and drop the backend override step.
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
        working-directory: infra

      # The S3 backend in backend.tf needs real AWS credentials, and `plan` refuses to run after
      # `init -backend=false` when a backend block exists. Override it with a local backend for plan-only review.
      - name: Use local backend (plan-only)
        run: printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -refresh=false -lock=false -input=false -no-color \
            -var-file=terraform.tfvars -out=tfplan | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: |
            infra/envs/${{ matrix.env }}/plan.txt
            infra/envs/${{ matrix.env }}/tfplan

      - name: Comment plan on PR
        if: always() && hashFiles(format('infra/envs/{0}/plan.txt', matrix.env)) != ''
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');
            const max = 60000;
            const body = [
              `<!-- tf-plan-${env} -->`,
              `### Terraform plan: \`${env}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan.length > max ? plan.slice(0, max) + '\n... (truncated, see artifact)' : plan,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(`<!-- tf-plan-${env} -->`));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
